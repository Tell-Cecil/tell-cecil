name = "tell-cecil-relay"
main = "worker.ts"
compatibility_date = "2026-10-01"

[vars]
CECIL_GITHUB_REPO = "owner/repo"
CECIL_PROJECT_KEY = "pk_abc"
CECIL_ORIGINS = "https://yoursite.com"
# GitLab instead: CECIL_GITLAB_PROJECT = "group/project" (and CECIL_GITLAB_URL when self-hosted).
# Jira instead: CECIL_JIRA_URL = "https://acme.atlassian.net", CECIL_JIRA_EMAIL, CECIL_JIRA_PROJECT = "WEB".

# GitHub App instead of a token: CECIL_GITHUB_APP_ID = "123456" here, and the key as a secret (below).

# Tokens and keys are secrets, not vars:
#   npx wrangler secret put CECIL_GITHUB_TOKEN   (or CECIL_GITHUB_APP_KEY, CECIL_GITLAB_TOKEN, CECIL_JIRA_TOKEN)
# `npx tell-cecil init` writes the same values to .env, so you can copy them from there.
